[project]
name = "drskill-core"
version = "0.6.6"
description = "brew doctor for your AI agent's skill loadout (minimal install; `drskill` is the full package)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pyyaml>=6",
    "tomli-w>=1",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# litellm 1.95.0 shipped without prebuilt wheels (new Rust bridge), so a
# fresh install tries to compile it and fails on machines without a recent
# rustc. Excluded until a wheel-bearing release exists.
deep = ["dspy>=3", "litellm!=1.95.0"]
connect = ["mcp>=1.2"]

[project.scripts]
drskill = "drskill.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drskill"]

[tool.uv]
dev-dependencies = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
